# 售后判定评估集（基于 sample_data/after_sales_a，领域 after_sales）
#
# 标签规则（与 domains/after_sales.yaml 一致）：
#   免费保修    质保期内，故障部件属于乙方设备或软件，且没有迹象表明属于除外情形；原因未查明不影响判定（先修后查）。
#   收费服务    超出质保期；易损件；甲方原因（违反规范、超负载、未经授权修改、气源电源网络不达标）；或新增服务。
#   需诊断确认  质保状态明确，但已有具体迹象指向除外情形（原因未查明的碰撞属于此类），或连故障部件都还不能确定；
#               查明后：乙方原因且在保，乙方免费发备品；甲方原因或超保，甲方按备件价格清单购买。
#
# 背景：终验收证书 2026-10-20 签署，质保期 2026-10-20 至 2027-10-19；提问时间在质保期内（除非用例另有说明）。
# evidence：判断依据应来自的文档（文件名片段）及其中逐字出现的原文。
# reviewed：标签是否已由售后负责人复核。草稿由 Claude 起草；A01、A06 已由业务负责人复核。
#
# 修订记录：
#   v1→v2：初版“需诊断确认”包含“故障原因还不能确定”，与“免费保修”重叠（v1 评估 0.792，错误集中在免费保修被判为
#          需诊断确认）。改为行业通行的“先修后查”口径。
#   v2→v4：业务负责人复核 A06——碰撞报警原因未查明时，责任归属和是否在保都定不了，无法确定是甲方购买还是乙方发备品，
#          必须先诊断。规则改为“原因未查明的碰撞判需诊断确认”（v3 曾误写成“碰撞一律需诊断”，原因已明确的 A05、A18
#          因此出错，v4 收窄）；并要求需诊断时说明查明后的两种处理。
#   v4→v5：业务负责人复核 A01——没有碰撞和误操作迹象时，部件自身故障基本就是免费保修。规则补充具体例子
#          （电机烧毁、传感器失效、触摸屏失灵、电源模块损坏）。

- id: A01
  request: R1 的 J2 轴伺服电机烧了，整线停产，客户要求免费更换，我们多久要到场？
  label: 免费保修
  category: 机器人
  evidence:
    - {doc: 售后服务协议, contains: 乙方免费维修或更换零部件}
    - {doc: 售后服务协议, contains: 24 小时内到场}
  rationale: 业务负责人复核：没有碰撞和误操作迹象，部件自身故障基本就是免费保修。伺服电机是乙方供货的备件；停线属于 P1，24 小时内到场。
  reviewed: true

- id: A02
  request: 夹爪指尖磨损了，抓取偶尔打滑，客户要求质保期内免费换。
  label: 收费服务
  category: 易损件
  evidence:
    - {doc: 售后服务协议, contains: 夹爪指尖、吸盘、视觉光源、安全光栅保护罩}
  rationale: 夹爪指尖是易损件，第五条（1）除外；工单 AS-002 同样按收费处理。
  reviewed: false

- id: A03
  request: 视觉光源不亮了，客户问能不能免费换一个。
  label: 收费服务
  category: 易损件
  evidence:
    - {doc: 售后服务协议, contains: 夹爪指尖、吸盘、视觉光源、安全光栅保护罩}
  rationale: 视觉光源列为易损件。
  reviewed: false

- id: A04
  request: 料仓 3 号抽屉的到位传感器坏了，推到位还是报未到位，这个算保修吗？
  label: 免费保修
  category: 机械
  evidence:
    - {doc: 备件价格清单, contains: 料仓到位传感器}
    - {doc: 售后工单记录, contains: 传感器批次缺陷}
  rationale: 到位传感器是备件不是易损件，同类工单 AS-001 判为批次缺陷免费更换。
  reviewed: false

- id: A05
  request: R2 给 VMC-04 上料时撞上了还没开到位的机床门，客户说上周他们电工调过机床的门信号延时，要求我们免费修夹爪。
  label: 收费服务
  category: 甲方原因
  evidence:
    - {doc: 售后服务协议, contains: 未经乙方书面同意}
    - {doc: 维修报告, contains: 甲方设备部于 2026-10-30 修改了机床侧自动门信号延时参数}
  rationale: 甲方自行修改机床侧信号参数导致碰撞，与 AS-003 相同，属于第五条除外情形。
  reviewed: false

- id: A06
  request: 夜班 R2 又报了 SRVO-050 碰撞检测，停了一会儿，客户问这个是不是保修，原因还不知道。
  label: 需诊断确认
  category: 机器人
  evidence:
    - {doc: 售后工单记录, contains: SRVO-050}
  rationale: 业务负责人复核：碰撞报警原因未查明，责任归属和是否在保都无法确认，也就无法确定是甲方购买还是乙方发备品，必须先诊断（AS-005 仍在调查）。
  reviewed: true

- id: A07
  request: 客户希望质保期内我们每个月都来做一次巡检，费用包含在保修里。
  label: 收费服务
  category: 服务
  evidence:
    - {doc: 售后服务协议, contains: 每季度一次免费预防性巡检}
  rationale: 免费巡检为每季度一次，超出频次按第六条收费。
  reviewed: false

- id: A08
  request: 早班夹爪经常报夹紧力不足，客户要求免费换夹爪气缸。
  label: 需诊断确认
  category: 气源
  evidence:
    - {doc: 巡检记录, contains: 0.46 MPa}
    - {doc: 售后服务协议, contains: 甲方提供的压缩空气、电源、网络不满足技术协议要求造成的损坏}
  rationale: 巡检发现早班气压 0.46 MPa 低于下限，报警可能是甲方气源问题而非气缸故障，需先确认。
  reviewed: false

- id: A09
  request: 地轨同步带磨得比较快，客户要求现在免费更换。
  label: 需诊断确认
  category: 机械
  evidence:
    - {doc: 巡检记录, contains: 地轨导轨 10 月未润滑}
    - {doc: 巡检记录, contains: 地轨同步带磨损偏快}
  rationale: 同步带是备件，但巡检发现甲方未按规范润滑导轨，磨损原因需确认。
  reviewed: false

- id: A10
