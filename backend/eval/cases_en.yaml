# Scope-judgment eval set, English (based on sample_data/project_a_en)
#
# The English version of cases.yaml: same ids, labels and categories, run against the English
# translation of the same project, so the two languages can be compared case by case.
#
# Label rules:
#   In scope      Explicitly included; a direct part of an agreed clause; or confirmed in writing (minutes, point list).
#   Out of scope  Explicitly excluded; conflicts with the agreed specification, quantity, brand or standard (a change);
#                 or explicitly the Buyer's responsibility.
#   Ambiguous     Not mentioned and cannot be clearly inferred from existing clauses; or a clause has two reasonable readings.
#
# evidence: the document (filename fragment) the judgment should rest on, and a passage that appears in it verbatim.
# reviewed: whether a project manager has reviewed the label. Labels follow cases.yaml.

- id: S01
  request: The customer's quality team wants the robot to read a QR code on each blank before picking it, bind the code to the machining result and send it to the MES. Is that our job?
  label: Out of scope
  category: Traceability
  evidence:
  - doc: Technical_Agreement
    contains: Workpiece traceability is not included in this phase
  rationale: Section 3.8 of the Technical Agreement explicitly excludes marking, code reading and barcode binding; only a PROFINET slot is reserved.
  reviewed: false

