# 变更范围判断评估集（基于 sample_data/project_a）
#
# 标签规则：
#   范围内   文档明确包含；或是已明确条款的直接组成部分；或已经书面确认（会议纪要、点表等）的内容。
#   范围外   文档明确排除；与已约定的规格、数量、品牌、标准冲突（属于变更）；或明确属于甲方责任。
#   存在歧义 文档没有提及，且不能从现有条款明确推断；或条款可以有两种合理解读。
#
# evidence：判断依据应来自的文档（文件名片段）及其中的原文片段（必须逐字出现）。
#   用于评估“检索到了没有”和“引用对了没有”。
# reviewed：标签是否已由项目经理复核。草稿由 Claude 起草，复核前不作为最终结论。

