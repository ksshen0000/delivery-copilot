[project]
name = "delivery-copilot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.165.0",
    "jieba>=0.42.1",
    "langchain-core>=1.8.3",
    "langchain-openai>=1.8.3",
    "langgraph>=1.2.23",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
